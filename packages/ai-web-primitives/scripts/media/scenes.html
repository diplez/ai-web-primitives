<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Escenas</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
      }
      #stage {
        box-sizing: border-box;
        padding: 28px;
        background: #0d1117;
      }
      .caption {
        text-align: center;
        font-size: 15px;
        color: #9198a1;
        margin-bottom: 14px;
      }
      .caption b {
        color: #e6edf3;
        font-family: ui-monospace, Consolas, monospace;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px 8px;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 2px;
      }
      figure dz-thinking-orb {
        --dz-orb-size: 100px;
      }
      figcaption {
        font:
          13px ui-monospace,
          Consolas,
          monospace;
        color: #9198a1;
      }
      .answer {
        font-size: 17px;
        line-height: 1.7;
        margin: 0;
        max-width: 540px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="bundle.js"></script>
  </body>
</html>
